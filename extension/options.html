<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>拾素材 · 连接设置</title><link rel="stylesheet" href="extension.css"></head><body class="options"><div class="settings"><div class="logo">拾</div><h1>连接你的素材库</h1><p>先启动拾素材，插件会自动连接本机素材库并保存密钥。也可以保留手动配置。</p><form id="settings-form"><label>本地服务地址<input name="server" value="http://127.0.0.1:41600" required></label><label><input name="autoConnect" type="checkbox" checked>自动连接本机素材库</label><button id="auto-connect-now" type="button">自动连接本机</button><label>连接密钥（自动获取，可留空）<input name="key" autocomplete="off" type="password"></label><label>默认标签<input name="tags" placeholder="例如：网页采集, 灵感"></label><button class="primary" type="submit">保存并测试连接</button></form><p id="status" role="status"></p><a href="http://127.0.0.1:41600" target="_blank" rel="noreferrer">打开本地素材库 ↗</a></div><script src="options.js"></script></body></html>
