<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="extension.css"><title>拾素材</title></head><body class="popup"><header><strong><span class="logo small">拾</span> 拾素材采集器</strong><div><button id="history" title="任务记录">☷</button><button id="settings" title="连接设置">⚙</button></div></header><div class="intro"><h1>收下这一页的灵感</h1><p id="status">连接素材库后，扫描当前页面的图片。</p></div><div class="capture-tools"><button id="visible-shot">当前画面</button><button id="region-shot">区域截图</button><button id="bookmark">收藏网页＋画面</button><button id="bookmark-only">仅网址</button></div><section id="duplicate-panel" hidden><h2>重复添加提示</h2><div class="duplicate-grid"><div><img class="duplicate-image" alt="已存在的素材"><b>已存在</b><p id="duplicate-existing"></p></div><div><img class="duplicate-image" alt="新提交的素材"><b>新文件</b><p id="duplicate-incoming"></p></div></div><p id="duplicate-info"></p><button id="duplicate-reuse" class="primary">使用已有素材并归类</button><button id="duplicate-keep">保留两者</button></section><section id="job-panel" hidden><strong id="job-heading"></strong><p id="job-current"></p><progress id="job-progress" max="100" value="0"></progress><p id="job-summary"></p><div class="job-actions"><button id="job-pause">暂停</button><button id="job-cancel">取消任务</button><button id="job-retry" hidden>重试失败项</button><button id="job-report">下载报告</button></div><button id="view-library">打开素材库查看</button><pre id="job-results" aria-live="polite"></pre><details id="job-errors" hidden><summary>查看失败原因</summary><ul id="job-error-list"></ul></details></section><button id="connect-local" class="primary" hidden>自动连接本机素材库</button><div class="controls"><button id="scan" class="primary">扫描页面图片</button><button id="select-all">全选</button><label>最小尺寸<select id="min-size"><option value="100">100px</option><option value="250">250px</option><option value="500">500px</option><option value="0">不限</option></select></label></div><div class="dest"><select id="folder"><option value="">未分类</option></select><input id="tags" placeholder="标签，用逗号分隔"></div><p id="destination-info" style="margin:0 20px 10px;overflow-wrap:anywhere"></p><div class="quality-row"><label>默认候选<select id="quality"><option value="best">页面提供的较大/原图候选</option><option value="current">当前显示图片</option></select></label><small>候选来自页面，原图质量以实际下载为准。</small></div><div id="images"></div><footer><span id="count">0 张图片</span><button id="capture" class="primary" disabled>采集所选</button></footer><dialog id="history-dialog"><h2>最近采集任务</h2><div id="history-content"></div><button id="close-history">关闭</button></dialog><script type="module" src="popup.js"></script></body></html>
